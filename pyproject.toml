[project]
name = "rag_against_the_machine"
version = "0.1.0"
description = "Retrieval-Augmented Generator for QWEN3-0.6B"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bm25s>=0.3.15",
    "fire>=0.7.1",
    "flake8>=7.4.1",
    "langchain-text-splitters>=1.1.3",
    "mypy>=2.4.0",
    "pathlib>=1.0.1",
    "pydantic>=2.14.1",
    "pytest>=9.2.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.1",
    "uuid>=1.30",
]

[[tool.mypy.overrides]]
module = [
    "bm25s.*",
    "tqdm.*",
    "fire"
    ]
ignore_missing_imports = true
